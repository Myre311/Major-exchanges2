[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Cache court avec revalidation — permet de propager rapidement les modifs
    # CSS/JS quand on push sans devoir attendre l'expiration côté client.
    # Pour un cache long-terme, on passera plus tard à un cache-busting par hash
    # de fichier (ex: style.[hash].css) via un build step.
    Cache-Control = "public, max-age=300, must-revalidate"
